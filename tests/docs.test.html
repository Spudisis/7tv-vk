<!doctype html>
<meta charset="utf-8" />
<title>VK7TV — документы: страницы и счётчики</title>
<body>
  <script src="harness.js"></script>
  <script>
    const T = window.VK7TV_TEST;
    const AUTH_KEY = '6287487:web_token:login:auth';
    localStorage.clear();
    localStorage.setItem(
      AUTH_KEY,
      JSON.stringify({ access_token: 'test-token', user_id: 1, expires: Math.floor(Date.now() / 1000) + 3600 })
    );

    const sizes = [
      { type: 's', src: 'https://sun9-1.userapi.com/s.jpg', width: 64, height: 48 },
      { type: 'm', src: 'https://sun9-1.userapi.com/m.jpg', width: 320, height: 240 },
    ];
    function doc(owner, id, ext, title, video) {
      const preview = { photo: { sizes } };
      if (video) preview.video = { src: 'https://vk.ru/video.mp4', width: 100, height: 100 };
      return {
        owner_id: owner,
        id,
        title,
        ext,
        size: 1024,
        date: 1700000000,
        url: `https://vk.ru/doc${owner}_${id}`,
        preview,
      };
    }
    const filler = (n) => doc(1, 9000 + n, 'pdf', `document-${n}.pdf`);
    const page0 = [doc(1, 1, 'gif', 'cat-one.gif', true), doc(1, 2, 'gif', 'cat-two.gif'), doc(1, 3, 'webp', 'cat-three.webp')];
    while (page0.length < 50) page0.push(filler(page0.length));
    const page50 = [doc(1, 1, 'gif', 'cat-one.gif', true)]; // дубль
    while (page50.length < 50) page50.push(filler(100 + page50.length));
    const page100 = [doc(1, 4, 'gif', 'last-cat.gif'), doc(2, 5, 'webp', 'other-user.webp')];
    while (page100.length < 50) page100.push(filler(200 + page100.length));

    const requests = [];
    window.fetch = (url, opts) => {
      const body = new URLSearchParams(opts.body);
      const offset = Number(body.get('offset')) || 0;
      requests.push({ url, offset, body: body.toString() });
      const page = offset === 0 ? page0 : offset === 50 ? page50 : offset === 100 ? page100 : [];
      return Promise.resolve({
        ok: true,
        status: 200,
        json: () => Promise.resolve({ response: { count: page.length, total_count: 150, items: page } }),
      });
    };
  </script>
  <script src="../vk-docs.js"></script>
  <script>
    T.run(async () => {
      const DOCS = window.VK7TV_DOCS;
      T.check('модуль документов загружен', !!DOCS, 'да');
      T.eq('до раскрытия запросов нет', requests.length, 0);
      T.eq('стартовый статус', DOCS.getState().status, 'idle');

      await DOCS.loadMore();
      T.eq('первая страница: смещения', requests.map((r) => r.offset).join(','), '0');
      T.eq('GIF и WEBP отобраны', DOCS.getItems().map((d) => d.ext).join(','), 'gif,gif,webp');
      T.eq('счётчик неполный', DOCS.getState().partial, true);
      T.check('токен только в теле', !requests[0].url.includes('access_token') && requests[0].body.includes('access_token'), 'да');
      T.eq('порядок ответа сохранён', DOCS.getItems().map((d) => d.title).join(','), 'cat-one.gif,cat-two.gif,cat-three.webp');

      await DOCS.loadMore();
      T.eq('пагинация пропускает страницу без файлов', requests.map((r) => r.offset).join(','), '0,50,100');
      T.eq('дубли не задвоили список', DOCS.getItems().length, 5);
      T.eq('после полной загрузки статус', DOCS.getState().status, 'ready');
      T.eq('счётчик полный', DOCS.getState().partial, false);
      T.eq('названия с посторонним файлом не потеряны', DOCS.filterItems('other').length, 1);

      const one = DOCS.getItems()[0];
      T.eq('пропорции по размерам превью', Math.round(one.ratio * 100), 133);
      T.eq('видео-превью GIF сохранено', !!one.video, true);
      T.eq('документ ищется по ключу', DOCS.getDocument('1:1').title, 'cat-one.gif');

      // Обновление: старый список остаётся до успешной первой страницы,
      // затем заменяется новой выборкой.
      const refreshing = DOCS.refresh();
      T.eq('обновление оставило старые данные до ответа', DOCS.getItems().length, 5);
      await refreshing;
      T.eq('после обновления только первая страница', DOCS.getItems().length, 3);
      await DOCS.loadAll();
      T.eq('догрузка после обновления', DOCS.getItems().length, 5);

      // Тот же пользователь с новым токеном — список не чистим.
      localStorage.setItem(
        AUTH_KEY,
        JSON.stringify({ access_token: 'test-token-2', user_id: 1, expires: Math.floor(Date.now() / 1000) + 3600 })
      );
      window.dispatchEvent(new StorageEvent('storage', { key: AUTH_KEY }));
      T.eq('новый токен того же пользователя сохранил список', DOCS.getItems().length, 5);

      // Другой пользователь — старые данные не должны остаться.
      const epoch = DOCS.getState().accountEpoch;
      localStorage.setItem(
        AUTH_KEY,
        JSON.stringify({ access_token: 'other-token', user_id: 2, expires: Math.floor(Date.now() / 1000) + 3600 })
      );
      window.dispatchEvent(new StorageEvent('storage', { key: AUTH_KEY }));
      T.eq('смена пользователя очистила список', DOCS.getItems().length, 0);
      T.eq('новый пользователь в состоянии', DOCS.getState().auth.userId, 2);
      T.check('эпоха аккаунта сменилась', DOCS.getState().accountEpoch !== epoch, 'да');
    });
  </script>
</body>
