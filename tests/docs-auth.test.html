<!doctype html>
<meta charset="utf-8" />
<title>VK7TV — документы: авторизация</title>
<body>
  <script src="harness.js"></script>
  <script src="auth-clock.js"></script>
  <script>
    const T = window.VK7TV_TEST;
    const AUTH_KEY = '6287487:web_token:login:auth';
    localStorage.clear();
    localStorage.setItem(AUTH_KEY, '{broken json');
    const requests = [];
    window.fetch = (url, opts) => {
      requests.push(url);
      const body = new URLSearchParams(opts.body);
      const one = {
        owner_id: 1,
        id: 1,
        title: 'ok.gif',
        ext: 'gif',
        size: 1,
        date: 1,
        url: 'https://vk.ru/doc1_1',
        preview: { photo: { sizes: [{ type: 's', src: 'https://sun9-1.userapi.com/s.jpg', width: 64, height: 64 }] } },
      };
      return Promise.resolve({
        ok: true,
        status: 200,
        json: () => Promise.resolve({ response: { count: body.get('offset') === '0' ? 1 : 0, total_count: 1, items: body.get('offset') === '0' ? [one] : [] } }),
      });
    };
  </script>
  <script src="../vk-docs.js"></script>
  <script>
    T.run(async () => {
      const DOCS = window.VK7TV_DOCS;
      T.eq('испорченный JSON — нет авторизации', DOCS.checkAuth(), false);
      T.eq('статус — unauthorized', DOCS.getState().status, 'unauthorized');
      T.eq('запрос при отсутствии токена не ушёл', requests.length, 0);
      T.eq('испорченный JSON назван', DOCS.getState().error.reason, 'bad-json');

      localStorage.setItem(AUTH_KEY, JSON.stringify({ access_token: '' }));
      T.eq('пустой токен — нет авторизации', DOCS.checkAuth(), false);
      T.eq('пустой токен назван', DOCS.getState().error.reason, 'no-token');

      localStorage.setItem(
        AUTH_KEY,
        JSON.stringify({
          access_token: 'old',
          user_id: 7,
          expires: Math.floor(Date.now() / 1000) - 60,
        })
      );
      T.eq('просроченный токен — нет авторизации', DOCS.checkAuth(), false);
      T.eq('до завершения повторов ошибки нет', DOCS.getState().error, null);
      await T.waitFor('повторы закончились', () => !!DOCS.getState().error);
      T.eq('три ожидания по пять секунд', VK7TV_AUTH_CLOCK.delays.join(','), '5000,5000,5000');
      T.eq('просроченный токен назван', DOCS.getState().error.reason, 'expired');
      T.check(
        'просроченный токен просит обновить страницу',
        DOCS.getState().error.message.includes('Срок токена'),
        DOCS.getState().error.message
      );

      const expires = Math.floor(Date.now() / 1000) + 3600;
      localStorage.setItem(AUTH_KEY, JSON.stringify({ access_token: 'good', user_id: 7, expires }));
      T.eq('живой токен принят', DOCS.checkAuth(), true);
      T.eq('пользователь прочитан', DOCS.getState().auth.userId, 7);
      await DOCS.loadMore();
      T.eq('после авторизации файл загрузился', DOCS.getItems().length, 1);
      T.eq('токен не попал в URL', requests.every((u) => !u.includes('good')), true);

      localStorage.removeItem(AUTH_KEY);
      T.eq('выход из VK отключает раздел', DOCS.checkAuth(), false);
      T.eq('список при выходе очищен', DOCS.getItems().length, 0);
      T.eq('статус после выхода', DOCS.getState().status, 'unauthorized');
      T.check(
        'текст просит обновить страницу VK',
        DOCS.getState().error.message.includes('Обнови страницу VK'),
        DOCS.getState().error.message
      );
      T.check(
        'локальная потеря входа не выдаётся за сетевой сбой',
        DOCS.getState().error.authSource === 'local' &&
          DOCS.getState().error.reason === 'missing',
        JSON.stringify(DOCS.getState().error)
      );
    });
  </script>
</body>
