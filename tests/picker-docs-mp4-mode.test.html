<!doctype html>
<meta charset="utf-8" />
<title>VK7TV — выбор режима MP4 в пикере</title>
<link rel="stylesheet" href="../picker.css" />
<body style="margin: 0; background: #141519">
  <div id="draft" contenteditable="true"></div>
  <script src="harness.js"></script>
  <script>
    const T = window.VK7TV_TEST;
    const AUTH_KEY = '6287487:web_token:login:auth';
    localStorage.clear();
    localStorage.setItem(
      AUTH_KEY,
      JSON.stringify({
        access_token: 'test-token',
        user_id: 42,
        expires: Math.floor(Date.now() / 1000) + 3600,
      })
    );
    window.fetch = (url) => {
      if (String(url).includes('web.api.vk.ru')) {
        return Promise.resolve({
          ok: true,
          status: 200,
          json: () =>
            Promise.resolve({ response: { count: 0, total_count: 0, items: [] } }),
        });
      }
      return Promise.reject(new Error('unexpected ' + url));
    };
    T.install({
      sync: {
        enabled: true,
        useGlobal: false,
        widget: true,
        sets: [],
        customEmotes: {},
        favorites: [],
      },
      local: {
        setEmotes: {},
        globalEmotes: null,
        recent: [],
        collapsedGroups: ['docs:files'],
        stripTab: 'recent',
        docsKnown: true,
      },
      respond: () => ({}),
    });
  </script>
  <script src="../default-emotes.js"></script>
  <script src="../emotes.js"></script>
  <script src="../mp4-parse.js"></script>
  <script src="../vk-docs.js"></script>
  <script src="../vk-docs-media.js"></script>
  <script src="../picker.js"></script>
  <script>
    const pngBytes = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);

    T.run(async () => {
      const DOCS = window.VK7TV_DOCS;
      const calls = [];
      const rejected = [];
      DOCS.enqueueUploads = (files, options) => {
        calls.push({
          names: Array.from(files || []).map((f) => f.name),
          options,
        });
        return [];
      };
      DOCS.enqueueRejected = (entries) => {
        rejected.push(...Array.from(entries || []));
        return [];
      };

      await T.waitFor('виджет появился', () => document.querySelector('.vk7tv-widget'));
      document.dispatchEvent(
        new KeyboardEvent('keydown', { code: 'KeyE', ctrlKey: true, shiftKey: true, bubbles: true })
      );
      await T.waitFor('пикер открылся', () => {
        const p = document.querySelector('.vk7tv-picker');
        return p && p.style.display !== 'none';
      });
      await T.waitFor('секция файлов появилась', () => document.querySelector('.vk7tv-docs-group'));

      const input = document.querySelector('.vk7tv-docs-upload-input');
      const batch = () => document.querySelector('.vk7tv-docs-batch');
      const batchVisible = () => !!batch() && batch().style.display !== 'none';
      const pick = (names, types) => {
        const dt = new DataTransfer();
        names.forEach((name, i) => {
          const type = types && types[i] ? types[i] : name.endsWith('.mp4') ? 'video/mp4' : 'image/png';
          dt.items.add(new File([type === 'video/mp4' ? new Uint8Array([0, 0, 0, 24]) : pngBytes], name, { type }));
        });
        input.files = dt.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
        return dt;
      };
      const choose = (value) => {
        const radio = batch().querySelector(`input[value="${value}"]`);
        radio.click();
      };
      const click = (action) =>
        batch().querySelector(`[data-batch-action="${action}"]`).click();

      // Только изображения: прежний путь без выбора режима.
      pick(['photo.png']);
      T.eq('только PNG: очередь сразу', calls.length, 1);
      T.eq('только PNG: без параметров', calls[0].options, undefined);
      T.eq('только PNG: блока режима нет', batchVisible(), false);

      // Смешанная партия: блок появляется, по умолчанию — GIF.
      pick(['clip.mp4', 'photo.png']);
      T.eq('партия с MP4: блок режима', batchVisible(), true);
      T.check(
        'партия с MP4: подпись',
        batch().querySelector('.vk7tv-docs-batch-title').textContent.includes('MP4'),
        batch().querySelector('.vk7tv-docs-batch-title').textContent
      );
      T.eq(
        'партия с MP4: по умолчанию GIF',
        batch().querySelector('input[value="gif"]').checked,
        true
      );
      const hint = batch().querySelector('.vk7tv-docs-batch-mode-hint').textContent;
      T.check('рядом с GIF: лимиты', hint.includes('15 с') && hint.includes('480'), hint);
      T.check('рядом с GIF: предупреждение', hint.includes('Без звука'), hint);

      T.eq('выбор GIF отмечен', batch().querySelector('input[value="gif"]').checked, true);
      click('add');
      T.eq('смешанная партия: одна отправка', calls.length, 2);
      T.eq('смешанная партия: режим GIF', calls[1].options.mp4Mode, 'gif');
      T.eq('смешанная партия: все файлы', calls[1].names.join(','), 'clip.mp4,photo.png');
      T.eq('после добавления блок скрыт', batchVisible(), false);

      // Отмена не ставит в очередь ни один файл партии.
      pick(['cancel.mp4', 'cancel.png']);
      click('cancel');
      T.eq('отмена: очередь не изменилась', calls.length, 2);
      T.eq('отмена: блок скрыт', batchVisible(), false);

      // Явный выбор исходного видео.
      pick(['original.mp4']);
      choose('original');
      click('add');
      T.eq('исходное видео: режим', calls[2].options.mp4Mode, 'original');
      T.eq('исходное видео: имя', calls[2].names.join(','), 'original.mp4');

      // Drag-and-drop: тот же блок и тот же выбор.
      const dt = new DataTransfer();
      dt.items.add(new File([new Uint8Array([0, 0, 0, 24])], 'drop.mp4', { type: 'video/mp4' }));
      document.dispatchEvent(new DragEvent('dragenter', { bubbles: true, dataTransfer: dt }));
      await T.waitFor('накладка drop появилась', () => {
        const dnd = document.querySelector('.vk7tv-docs-dnd');
        return dnd && !dnd.hidden;
      });
      const dnd = document.querySelector('.vk7tv-docs-dnd');
      dnd.dispatchEvent(
        new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt })
      );
      await T.waitFor('drop: блок режима', batchVisible);
      T.eq('drop: блок появился', batchVisible(), true);
      T.eq('новая партия сбрасывает выбор на GIF', batch().querySelector('input[value="gif"]').checked, true);
      click('add');
      T.eq('drop: режим GIF', calls.at(-1).options.mp4Mode, 'gif');
      T.eq('drop: файл партии', calls.at(-1).names.join(','), 'drop.mp4');

      // Закрытие пикера отменяет неотправленную партию.
      pick(['late.mp4']);
      T.eq('перед закрытием блок есть', batchVisible(), true);
      document.dispatchEvent(
        new KeyboardEvent('keydown', { code: 'KeyE', ctrlKey: true, shiftKey: true, bubbles: true })
      );
      T.eq('закрытие сбросило партию', batchVisible(), false);
      T.eq('закрытие не отправило файл', calls.length, 4);
    });
  </script>
</body>
